{% extends "base.html" %}
{% block title %}ComicCraft — Exported{% endblock %}

{% block content %}
<section class="card success">
    <div class="success-icon">✓</div>
    <h1>Your comic is ready!</h1>
    <p>The PDF was generated successfully.</p>
    {% if pdf_path %}
    <a class="button" href="{{ pdf_path }}" download>Download PDF</a>
    {% endif %}
    <a class="button secondary" href="/">Go Create Another Comic</a>
</section>
{% endblock %}
